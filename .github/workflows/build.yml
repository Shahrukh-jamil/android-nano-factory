name: Build Android APK Fast

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'Gist ID'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install requests
      - run: python injector.py ${{ github.event.inputs.gist_id }}
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Keystore Safely with Python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '').strip().replace('\n', '').replace('\r', '').replace(' ', '')
          if not raw:
              raise ValueError('KEYSTORE_BASE64 secret is EMPTY!')
          missing_padding = len(raw) % 4
          if missing_padding:
              raw += '=' * (4 - missing_padding)
          with open('app/release-key.jks', 'wb') as f:
              f.write(base64.b64decode(raw))
          "

      - name: Build Sideload APK Only (Ultra Fast)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          touch app/proguard-rules.pro
          gradle assembleRelease -Pandroid.useAndroidX=true
          
      - name: Upload APK with Direct MIME Type (Fixes .zip bug)
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          
          # Force Android package MIME type and explicit filename
          APK_LINK=$(curl -sSf -H "Content-Type: application/vnd.android.package-archive" -H "X-Filename: NanoDraw.apk" --upload-file "$APK_PATH" "https://transfer.sh/NanoDraw.apk" || curl -sSf -F "file=@$APK_PATH;filename=NanoDraw.apk" https://temp.sh/upload)
          
          echo "### 🎨 NanoDraw Build Finished!" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Download APK:** [Direct Download Link]($APK_LINK)" >> $GITHUB_STEP_SUMMARY
          printf "\nDirect APK URL: %s\n" "$APK_LINK" >> $GITHUB_STEP_SUMMARY