name: Build Android APK Fast

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'Gist ID'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install requests
      - run: python injector.py ${{ github.event.inputs.gist_id }}
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Keystore Safely with Python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '').strip().replace('\n', '').replace('\r', '').replace(' ', '')
          if not raw:
              raise ValueError('KEYSTORE_BASE64 secret is EMPTY!')
          missing_padding = len(raw) % 4
          if missing_padding:
              raw += '=' * (4 - missing_padding)
          with open('app/release-key.jks', 'wb') as f:
              f.write(base64.b64decode(raw))
          "

      - name: Build Sideload APK Only (Ultra Fast)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          gradle assembleRelease -Pandroid.useAndroidX=true
          
      - name: Upload APK to Catbox.moe and Temp.sh
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          FINAL_APK_NAME="${APP_NAME:-App}.apk"
          
          # Copy to a dynamically named file to preserve APK filename on temp.sh
          cp "$APK_PATH" "$FINAL_APK_NAME"
          
          # Execute dual uploads gracefully
          CATBOX_LINK=$(curl -sSf -F "reqtype=fileupload" -F "fileToUpload=@$FINAL_APK_NAME" https://catbox.moe/user/api.php || echo "Catbox Failed")
          TEMP_SH_LINK=$(curl -sSf -F "file=@$FINAL_APK_NAME" https://temp.sh/upload || echo "Temp.sh Failed")
          
          echo "CATBOX_LINK=$CATBOX_LINK"
          echo "TEMPSH_LINK=$TEMP_SH_LINK"
          echo "### 🎨 ${{ env.APP_NAME }} Build Finished!" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Download APK (Catbox):** [Direct Download Link]($CATBOX_LINK)" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Download APK (Temp.sh):** [Direct Download Link]($TEMP_SH_LINK)" >> $GITHUB_STEP_SUMMARY
          printf "\nCatbox URL: %s\n" "$CATBOX_LINK" >> $GITHUB_STEP_SUMMARY
          printf "\nTemp.sh URL: %s\n" "$TEMP_SH_LINK" >> $GITHUB_STEP_SUMMARY
