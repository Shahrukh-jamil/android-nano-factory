name: Build Play Store Android App

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'Gist ID'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install requests
      - run: python injector.py ${{ github.event.inputs.gist_id }}
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Keystore Safely with Python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '').strip().replace('\n', '').replace('\r', '').replace(' ', '')
          if not raw:
              raise ValueError('KEYSTORE_BASE64 secret is EMPTY! Please check GitHub Secrets.')
          missing_padding = len(raw) % 4
          if missing_padding:
              raw += '=' * (4 - missing_padding)
          with open('app/release-key.jks', 'wb') as f:
              f.write(base64.b64decode(raw))
          print('✅ Keystore decoded successfully! Size:', os.path.getsize('app/release-key.jks'), 'bytes')
          "

      - name: Build Release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          touch app/proguard-rules.pro
          gradle assembleRelease bundleRelease
          
      - name: Upload APK & AAB to Temp Host
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          
          APK_LINK=$(curl -s --upload-file "$APK_PATH" https://transfer.sh/app-release.apk || curl -s -F "file=@$APK_PATH" https://temp.sh/upload)
          AAB_LINK=$(curl -s --upload-file "$AAB_PATH" https://transfer.sh/app-release.aab || curl -s -F "file=@$AAB_PATH" https://temp.sh/upload)
          
          echo "### 🚀 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Download APK:** [Click Here to Download]($APK_LINK)" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Download AAB (Play Store):** [Click Here to Download]($AAB_LINK)" >> $GITHUB_STEP_SUMMARY
          echo -e "\nDirect APK URL: $APK_LINK" >> $GITHUB_STEP_SUMMARY